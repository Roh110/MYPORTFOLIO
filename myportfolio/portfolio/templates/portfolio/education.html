{% extends 'portfolio/base.html' %}
{% block title %}Education | M Rohitha Reddy{% endblock %}
{% block content %}
<div class="page-planet-section planet-education">
    <div class="planet-hero">
        <span class="planet-core"></span>
        <span class="planet-ring"></span>
        <span class="planet-label">Education</span>
    </div>
</div>
<section class="section education" id="education">
    <div class="section-heading">
        <span>Education</span>
        <h3>Academic profile</h3>
    </div>
    <div class="education-grid">
        {% for item in education %}
            <div class="education-card">
                <h4>{{ item.degree }}</h4>
                <p>{{ item.institution }}</p>
                <span class="meta">{{ item.year }}</span>
                <p>{{ item.details }}</p>
            </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
